<h2>Person List</h2>

<table border="1" style="margin: auto; width: 50%; border-collapse: collapse;">
  <thead>
    <tr>
      <th>Person Name</th>
      <th>City</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let person of persons">
      <td>{{ person.name }}</td>
      <td>{{ person.city }}</td>
    </tr>
  </tbody>
</table>
