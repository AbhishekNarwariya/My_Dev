<h1>Parent Component</h1>

<div *ngIf="user">
  <h2>{{ user.name }}'s Posts</h2>
  <p>Email: {{ user.email }}</p>

  <ul *ngIf="posts.length > 0; else noPosts">
    <li *ngFor="let post of posts">
      <strong>{{ post.title }}</strong><br />
      {{ post.body }}
    </li>
  </ul>

  <ng-template #noPosts>
    <p>No posts found for this user.</p>
  </ng-template>
</div>
