<select [(ngModel)]="selectedCountry" (change)="onCountryChange()">
    <option value="">Select Country</option>
    <option *ngFor="let c of countries" [value]="c.code">
        {{c.name}}
    </option>
</select>

<select [(ngModel)]="selectedState" [disabled]="!states.length">
    <option value="">select states</option>
    <option *ngFor="let s of states" [value]="s">
        {{ s }}
    </option>
</select>

<p>You selected: {{ selectedCountry }} - {{ selectedState }}</p>
