<div *ngIf="loading">Loading data...</div>
<div *ngIf="error">{{ error }}</div>

<div *ngIf="!loading && !error">
  <h2>Users</h2>
  <ul>
    <li *ngFor="let user of users">
      {{ user.name }} ({{ user.email }})
    </li>
  </ul>

  <h2>Posts</h2>
  <ul>
    <li *ngFor="let post of posts">
      <strong>{{ post.title }}</strong> - {{ post.body }}
    </li>
  </ul>
</div>
