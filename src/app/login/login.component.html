<h2>Login</h2>

<form [formGroup]="userForm">
    <label>userName</label>
    <input type="text" placeholder="enter the username" formControlName="username">
    <br>
     <label>password</label>
    <input type="password" placeholder="enter the username" formControlName="password">
    <button type="button" (click)="userLogin()">send</button>
</form>
