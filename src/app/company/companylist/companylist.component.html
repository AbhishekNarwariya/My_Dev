<h2>Company List</h2>

<table border="1" style="margin: auto; width: 50%; border-collapse: collapse;">
  <thead>
    <tr>
      <th>Company Name</th>
      <th>Country</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of company">
      <td>{{ item.name }}</td>
      <td>{{ item.country }}</td>
    </tr>
  </tbody>
</table>
